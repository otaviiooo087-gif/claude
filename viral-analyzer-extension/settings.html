<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Analyzer — Configurações</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="logo-icon">⚡</span>
      <h1>Viral Analyzer</h1>
      <span class="subtitle">Configurações</span>
    </header>

    <main>
      <div class="section">
        <h2>Chaves de API</h2>
        <p class="desc">Suas chaves são salvas localmente no Chrome e nunca enviadas para terceiros.</p>

        <div class="field">
          <label for="openaiKey">
            OpenAI API Key
            <span class="badge">Whisper — Transcrição</span>
          </label>
          <div class="input-row">
            <input type="password" id="openaiKey" placeholder="sk-..." autocomplete="off">
            <button class="toggle-btn" data-target="openaiKey">👁</button>
          </div>
          <p class="field-hint">Usada para transcrever o áudio com Whisper-1. <a href="https://platform.openai.com/api-keys" target="_blank">Obter chave →</a></p>
        </div>

        <div class="field">
          <label for="claudeKey">
            Anthropic API Key
            <span class="badge">Claude — Análise</span>
          </label>
          <div class="input-row">
            <input type="password" id="claudeKey" placeholder="sk-ant-..." autocomplete="off">
            <button class="toggle-btn" data-target="claudeKey">👁</button>
          </div>
          <p class="field-hint">Usada para análise e geração de roteiros com Claude. <a href="https://console.anthropic.com/settings/keys" target="_blank">Obter chave →</a></p>
        </div>
      </div>

      <div class="section">
        <h2>Modelo Claude</h2>
        <select id="claudeModel">
          <option value="claude-sonnet-4-6">claude-sonnet-4-6 (Recomendado)</option>
          <option value="claude-opus-4-7">claude-opus-4-7 (Mais poderoso)</option>
          <option value="claude-haiku-4-5-20251001">claude-haiku-4-5-20251001 (Mais rápido)</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn-save" id="saveBtn">💾 Salvar Configurações</button>
      </div>

      <div id="saveMsg" class="save-msg"></div>
    </main>
  </div>
  <script src="settings.js"></script>
</body>
</html>
