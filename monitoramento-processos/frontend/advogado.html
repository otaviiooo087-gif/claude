<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Área do Advogado</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><a href="index.html">&larr; voltar</a></header>
  <main>
    <h1>Área do Advogado</h1>
    <p class="subtitulo">Cadastre sua OAB para acompanhar seus processos automaticamente.</p>

    <section id="secao-oab" class="card">
      <label for="oab">Número da OAB</label>
      <input id="oab" placeholder="123456" />

      <label for="uf">UF da OAB</label>
      <select id="uf">
        <option value="">Selecione o estado</option>
        <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
        <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
        <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
        <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
        <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
        <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
        <option>SP</option><option>SE</option><option>TO</option>
      </select>

      <button id="botao-continuar">Continuar</button>
      <div id="mensagem-oab"></div>
    </section>

    <section id="secao-login" class="card oculto">
      <p>Bem-vindo(a) de volta. Digite sua senha:</p>
      <label for="login-senha">Senha</label>
      <input id="login-senha" type="password" />
      <button id="botao-entrar">Entrar</button>
      <div id="mensagem-login"></div>
    </section>

    <section id="secao-cadastro" class="card oculto">
      <p>Não encontramos essa OAB. Preencha para se cadastrar:</p>
      <label for="cadastro-nome">Nome</label>
      <input id="cadastro-nome" placeholder="Seu nome" />

      <label for="cadastro-email">E-mail</label>
      <input id="cadastro-email" type="email" placeholder="voce@exemplo.com" />

      <label for="cadastro-senha">Senha (mín. 6 caracteres)</label>
      <input id="cadastro-senha" type="password" />

      <button id="botao-cadastrar">Cadastrar</button>
      <div id="mensagem-cadastro"></div>
    </section>

    <section id="secao-dashboard" class="oculto">
      <div class="card">
        <div class="rodape-acoes">
          <span class="identificacao" id="identificacao-advogado"></span>
          <button class="secundario pequeno" id="botao-sair">Sair</button>
        </div>
        <div class="rodape-acoes" style="margin-top: 0.8rem;">
          <button id="botao-sincronizar">Buscar processos agora (DJEN)</button>
          <button class="secundario" id="botao-atualizar-lista">Atualizar lista</button>
        </div>
        <div id="mensagem-dashboard"></div>
      </div>

      <div id="lista-processos"></div>
    </section>
  </main>

  <script>
    const API = "";
    const secaoOab = document.getElementById("secao-oab");
    const secaoLogin = document.getElementById("secao-login");
    const secaoCadastro = document.getElementById("secao-cadastro");
    const secaoDashboard = document.getElementById("secao-dashboard");

    function mostrarMensagem(elId, texto, tipo) {
      const el = document.getElementById(elId);
      el.className = "mensagem " + tipo;
      el.textContent = texto;
    }

    function limparMensagem(elId) {
      const el = document.getElementById(elId);
      el.textContent = "";
      el.className = "";
    }

    function sessaoAtual() {
      const bruto = localStorage.getItem("sessao");
      return bruto ? JSON.parse(bruto) : null;
    }

    async function chamarAutenticado(caminho, opcoes = {}) {
      const sessao = sessaoAtual();
      const resp = await fetch(`${API}${caminho}`, {
        ...opcoes,
        headers: {
          ...(opcoes.headers || {}),
          Authorization: `Bearer ${sessao.token}`,
        },
      });
      if (resp.status === 401) {
        localStorage.removeItem("sessao");
        location.reload();
        throw new Error("Sessão expirada.");
      }
      return resp;
    }

    document.getElementById("botao-continuar").addEventListener("click", async () => {
      limparMensagem("mensagem-oab");
      const oab = document.getElementById("oab").value.trim();
      const uf = document.getElementById("uf").value;

      if (!oab || !uf) {
        mostrarMensagem("mensagem-oab", "Preencha OAB e UF.", "erro");
        return;
      }

      try {
        const resp = await fetch(`${API}/advogados/buscar?oab=${encodeURIComponent(oab)}&uf=${encodeURIComponent(uf)}`);
        secaoOab.classList.add("oculto");
        if (resp.status === 404) {
          secaoCadastro.classList.remove("oculto");
        } else if (resp.ok) {
          secaoLogin.classList.remove("oculto");
        } else {
          throw new Error("Erro ao verificar OAB.");
        }
      } catch (erro) {
        secaoOab.classList.remove("oculto");
        mostrarMensagem("mensagem-oab", erro.message, "erro");
      }
    });

    document.getElementById("botao-entrar").addEventListener("click", async () => {
      limparMensagem("mensagem-login");
      const oab = document.getElementById("oab").value.trim();
      const uf = document.getElementById("uf").value;
      const senha = document.getElementById("login-senha").value;

      try {
        const resp = await fetch(`${API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ oab, uf, senha }),
        });
        if (!resp.ok) {
          const corpo = await resp.json();
          throw new Error(corpo.detail || "Erro ao entrar.");
        }
        const sessao = await resp.json();
        entrarNoPainel({ ...sessao, oab, uf });
      } catch (erro) {
        mostrarMensagem("mensagem-login", erro.message, "erro");
      }
    });

    document.getElementById("botao-cadastrar").addEventListener("click", async () => {
      limparMensagem("mensagem-cadastro");
      const oab = document.getElementById("oab").value.trim();
      const uf = document.getElementById("uf").value;
      const nome = document.getElementById("cadastro-nome").value.trim();
      const email = document.getElementById("cadastro-email").value.trim();
      const senha = document.getElementById("cadastro-senha").value;

      if (!nome || !email || !senha) {
        mostrarMensagem("mensagem-cadastro", "Preencha todos os campos.", "erro");
        return;
      }

      try {
        const resp = await fetch(`${API}/advogados`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ oab, uf, nome, email, senha }),
        });
        if (!resp.ok) {
          const corpo = await resp.json();
          const detalhe = Array.isArray(corpo.detail)
            ? corpo.detail.map((d) => d.msg).join(", ")
            : corpo.detail;
          throw new Error(detalhe || "Erro ao cadastrar.");
        }
        const sessao = await resp.json();
        entrarNoPainel({ ...sessao, oab, uf });
      } catch (erro) {
        mostrarMensagem("mensagem-cadastro", erro.message, "erro");
      }
    });

    function entrarNoPainel(sessao) {
      localStorage.setItem("sessao", JSON.stringify(sessao));
      secaoOab.classList.add("oculto");
      secaoLogin.classList.add("oculto");
      secaoCadastro.classList.add("oculto");
      secaoDashboard.classList.remove("oculto");
      document.getElementById("identificacao-advogado").textContent =
        `${sessao.nome || ""} — OAB ${sessao.oab}/${sessao.uf}`;
      carregarProcessos();
    }

    document.getElementById("botao-sair").addEventListener("click", async () => {
      try {
        await chamarAutenticado("/logout", { method: "POST" });
      } catch {
        // sessão já pode ter expirado — segue o logout local mesmo assim
      }
      localStorage.removeItem("sessao");
      location.reload();
    });

    document.getElementById("botao-sincronizar").addEventListener("click", async () => {
      limparMensagem("mensagem-dashboard");
      mostrarMensagem("mensagem-dashboard", "Buscando novas comunicações no DJEN...", "sucesso");
      try {
        const resp = await chamarAutenticado("/sincronizar", { method: "POST" });
        if (!resp.ok) throw new Error("Falha ao sincronizar.");
        mostrarMensagem("mensagem-dashboard", "Sincronização concluída.", "sucesso");
        carregarProcessos();
      } catch (erro) {
        mostrarMensagem("mensagem-dashboard", erro.message, "erro");
      }
    });

    document.getElementById("botao-atualizar-lista").addEventListener("click", carregarProcessos);

    async function carregarProcessos() {
      const lista = document.getElementById("lista-processos");
      lista.innerHTML = "Carregando...";
      const resp = await chamarAutenticado("/processos");
      const processos = await resp.json();

      if (processos.length === 0) {
        lista.innerHTML = '<div class="card">Nenhum processo encontrado ainda. Clique em "Buscar processos agora".</div>';
        return;
      }

      lista.innerHTML = "";
      processos.forEach((processo) => {
        const div = document.createElement("div");
        div.className = "processo";
        div.innerHTML = `
          <div class="processo-cabecalho">
            <span class="numero-processo">${processo.numero}</span>
            <span class="tag">${processo.status || "sem status"}</span>
          </div>
          <p class="orgao">${processo.orgao || ""}</p>
          ${processo.cliente_cpf
            ? `<p class="orgao">Vinculado ao CPF ${processo.cliente_cpf}</p>`
            : `<div class="vincular">
                 <input placeholder="CPF do cliente" data-processo="${processo.id}" class="input-cpf-vincular" />
                 <button class="secundario pequeno botao-vincular" data-processo="${processo.id}">Vincular</button>
               </div>
               <div class="codigo-gerado" data-resultado="${processo.id}"></div>`}
        `;
        lista.appendChild(div);
      });

      document.querySelectorAll(".botao-vincular").forEach((botao) => {
        botao.addEventListener("click", async () => {
          const processoId = botao.dataset.processo;
          const input = document.querySelector(`.input-cpf-vincular[data-processo="${processoId}"]`);
          const resultado = document.querySelector(`[data-resultado="${processoId}"]`);
          const cpf = input.value.trim();
          if (!cpf) return;

          try {
            const resp = await chamarAutenticado(`/processos/${processoId}/vincular-cliente`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ cpf }),
            });
            if (!resp.ok) {
              const corpo = await resp.json();
              throw new Error(corpo.detail || "Erro ao vincular.");
            }
            const { codigo_acesso } = await resp.json();
            resultado.textContent = `Código de acesso do cliente: ${codigo_acesso} (repasse a ele)`;
          } catch (erro) {
            resultado.textContent = erro.message;
            resultado.style.color = "var(--danger)";
          }
        });
      });
    }

    (function inicializar() {
      const sessao = sessaoAtual();
      if (sessao) {
        entrarNoPainel(sessao);
      }
    })();
  </script>
</body>
</html>
