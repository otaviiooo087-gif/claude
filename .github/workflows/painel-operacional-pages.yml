name: Painel Operacional — publica no GitHub Pages

on:
  push:
    branches:
      - claude/new-session-uzro2l
    paths:
      - 'painel-operacional/**'
      - '.github/workflows/painel-operacional-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: painel-operacional

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: painel-operacional/package-lock.json

      - run: npm ci

      - name: Build (export estático com basePath /claude)
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel-operacional/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
