<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Artes IA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>🎨 Gerador de Artes IA</h1>
      <p>Descreva a imagem que você imagina e deixe a IA criar para você.</p>
      <a class="nav-link" href="chat.html">💬 Ir para o Chat</a>
    </header>

    <main class="app__main">
      <form id="generate-form" class="panel">
        <label for="prompt">Descrição da arte</label>
        <textarea
          id="prompt"
          name="prompt"
          rows="4"
          placeholder="Ex: um astronauta surfando em um anel de Saturno, estilo aquarela, cores vibrantes"
          required
        ></textarea>

        <div class="options">
          <div class="field">
            <label for="size">Tamanho</label>
            <select id="size" name="size">
              <option value="1024x1024">Quadrado (1024x1024)</option>
              <option value="1024x1536">Retrato (1024x1536)</option>
              <option value="1536x1024">Paisagem (1536x1024)</option>
            </select>
          </div>

          <div class="field">
            <label for="quality">Qualidade</label>
            <select id="quality" name="quality">
              <option value="auto">Automática</option>
              <option value="low">Baixa (mais rápido)</option>
              <option value="medium">Média</option>
              <option value="high">Alta (mais lento)</option>
            </select>
          </div>

          <div class="field">
            <label for="n">Quantidade</label>
            <select id="n" name="n">
              <option value="1">1 imagem</option>
              <option value="2">2 imagens</option>
              <option value="3">3 imagens</option>
              <option value="4">4 imagens</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submit-btn">Gerar arte</button>
        <p id="error" class="error" hidden></p>
      </form>

      <section class="results">
        <div id="loading" class="loading" hidden>
          <div class="spinner"></div>
          <p>Gerando sua arte, aguarde...</p>
        </div>
        <div id="gallery" class="gallery"></div>

        <h2 id="history-title" hidden>Histórico</h2>
        <div id="history" class="gallery gallery--history"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
