<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gerador de Artes IA</title>
<style>
  :root {
    --bg: #212121;
    --panel: #2a2a2a;
    --input-bg: #2f2f2f;
    --border: #3d3d3d;
    --text: #ececec;
    --muted: #9b9b9b;
    --accent: #10a37f;
    --accent-hover: #0e8f6f;
    --danger: #f87171;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { text-align: center; margin-bottom: 1.75rem; }
  header h1 { margin: 0 0 0.35rem; font-size: 1.9rem; }
  header p { color: var(--muted); margin: 0; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .key-card { display: flex; flex-direction: column; gap: 0.65rem; }
  .key-row { display: flex; gap: 0.5rem; }
  .key-row input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.6rem 0.75rem;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .key-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .key-status strong { color: var(--accent); }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 0;
    text-decoration: underline;
  }

  label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.35rem; }
  textarea, select, input[type="password"], input[type="text"] {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.65rem 0.75rem;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus, select:focus, input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
    margin: 1rem 0;
  }

  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .error {
    color: var(--danger);
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.35);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    margin: 0.9rem 0 0;
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    color: var(--muted);
    padding: 2rem 0;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }
  .gcard {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .gcard img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
  .gcard .foot {
    padding: 0.55rem 0.7rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }
  .gcard .foot span {
    font-size: 0.72rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .gcard .foot a { color: var(--accent); font-size: 0.78rem; text-decoration: none; white-space: nowrap; }
  .gcard .foot a:hover { text-decoration: underline; }

  h2.section-title {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 2rem 0 0.75rem;
    border-top: 1px solid var(--border);
    padding-top: 1.5rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎨 Gerador de Artes IA</h1>
      <p>Página única, sem servidor — sua chave fica só no seu navegador.</p>
      <a href="index.html" style="color:var(--accent);font-size:0.85rem;text-decoration:none;display:inline-block;margin-top:0.6rem;">⬅ Versão com servidor / Chat</a>
    </header>

    <section id="key-card" class="card key-card">
      <div id="key-form">
        <label for="api-key">Sua chave da OpenAI (sk-...)</label>
        <div class="key-row">
          <input type="password" id="api-key" placeholder="sk-..." autocomplete="off" />
          <button type="button" class="primary" style="width:auto" id="save-key-btn">Salvar</button>
        </div>
      </div>
      <div id="key-status" class="key-status" hidden>
        <span>Chave salva neste navegador <strong>✓</strong></span>
        <button type="button" class="link-btn" id="change-key-btn">trocar</button>
      </div>
    </section>

    <form id="generate-form" class="card">
      <label for="prompt">Descrição da arte</label>
      <textarea id="prompt" rows="5" placeholder="Descreva a imagem que você quer gerar..." required></textarea>

      <div class="options">
        <div>
          <label for="size">Tamanho</label>
          <select id="size">
            <option value="1024x1024">Quadrado (1024x1024)</option>
            <option value="1024x1536">Retrato (1024x1536)</option>
            <option value="1536x1024">Paisagem (1536x1024)</option>
          </select>
        </div>
        <div>
          <label for="quality">Qualidade</label>
          <select id="quality">
            <option value="auto">Automática</option>
            <option value="low">Baixa</option>
            <option value="medium">Média</option>
            <option value="high">Alta</option>
          </select>
        </div>
        <div>
          <label for="n">Quantidade</label>
          <select id="n">
            <option value="1">1 imagem</option>
            <option value="2">2 imagens</option>
            <option value="3">3 imagens</option>
            <option value="4">4 imagens</option>
          </select>
        </div>
      </div>

      <button type="submit" class="primary" id="submit-btn">Gerar arte</button>
      <p id="error" class="error" hidden></p>
    </form>

    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <p>Gerando sua arte, aguarde...</p>
    </div>

    <div id="gallery" class="gallery"></div>

    <h2 id="history-title" class="section-title" hidden>Histórico</h2>
    <div id="history" class="gallery"></div>
  </div>

  <script>
    const KEY_STORAGE = 'art-generator-openai-key';
    const HISTORY_STORAGE = 'art-generator-standalone-history';
    const HISTORY_LIMIT = 20;

    const keyForm = document.getElementById('key-form');
    const keyStatus = document.getElementById('key-status');
    const apiKeyInput = document.getElementById('api-key');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const changeKeyBtn = document.getElementById('change-key-btn');

    const form = document.getElementById('generate-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorEl = document.getElementById('error');
    const loadingEl = document.getElementById('loading');
    const galleryEl = document.getElementById('gallery');
    const historyEl = document.getElementById('history');
    const historyTitleEl = document.getElementById('history-title');

    function getSavedKey() {
      return localStorage.getItem(KEY_STORAGE) || '';
    }

    function refreshKeyUI() {
      const saved = getSavedKey();
      keyForm.hidden = !!saved;
      keyStatus.hidden = !saved;
    }

    saveKeyBtn.addEventListener('click', () => {
      const value = apiKeyInput.value.trim();
      if (!value.startsWith('sk-')) {
        alert('Cole uma chave válida da OpenAI (começa com "sk-").');
        return;
      }
      localStorage.setItem(KEY_STORAGE, value);
      apiKeyInput.value = '';
      refreshKeyUI();
    });

    changeKeyBtn.addEventListener('click', () => {
      localStorage.removeItem(KEY_STORAGE);
      refreshKeyUI();
    });

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_STORAGE)) ?? [];
      } catch {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem(HISTORY_STORAGE, JSON.stringify(history.slice(0, HISTORY_LIMIT)));
    }

    function createCard(imageSrc, prompt) {
      const card = document.createElement('div');
      card.className = 'gcard';

      const img = document.createElement('img');
      img.src = imageSrc;
      img.alt = prompt;

      const foot = document.createElement('div');
      foot.className = 'foot';

      const span = document.createElement('span');
      span.title = prompt;
      span.textContent = prompt;

      const a = document.createElement('a');
      a.href = imageSrc;
      a.download = 'arte-gerada.png';
      a.textContent = 'Baixar';

      foot.append(span, a);
      card.append(img, foot);
      return card;
    }

    function renderHistory() {
      const history = loadHistory();
      historyEl.innerHTML = '';
      historyTitleEl.hidden = history.length === 0;
      history.forEach((item) => historyEl.appendChild(createCard(item.image, item.prompt)));
    }

    function showError(message) {
      errorEl.innerHTML = message;
      errorEl.hidden = !message;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showError('');

      const apiKey = getSavedKey();
      if (!apiKey) {
        showError('Salve sua chave da OpenAI acima antes de gerar.');
        return;
      }

      const prompt = document.getElementById('prompt').value.trim();
      const size = document.getElementById('size').value;
      const quality = document.getElementById('quality').value;
      const n = Number(document.getElementById('n').value);

      if (!prompt) {
        showError('Descreva a arte que você quer gerar.');
        return;
      }

      submitBtn.disabled = true;
      loadingEl.hidden = false;
      galleryEl.innerHTML = '';

      try {
        const response = await fetch('https://api.openai.com/v1/images/generations', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${apiKey}`,
          },
          body: JSON.stringify({ model: 'gpt-image-1', prompt, size, quality, n }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.error?.message || 'Não foi possível gerar a imagem.');
        }

        const history = loadHistory();
        (data.data ?? []).forEach((item) => {
          const imageSrc = `data:image/png;base64,${item.b64_json}`;
          galleryEl.appendChild(createCard(imageSrc, prompt));
          history.unshift({ image: imageSrc, prompt });
        });
        saveHistory(history);
        renderHistory();
      } catch (err) {
        if (err instanceof TypeError) {
          showError(
            'Não foi possível conectar diretamente à OpenAI pelo navegador (provavelmente bloqueio de CORS). ' +
            'Use a versão com servidor do projeto (pasta art-generator, comando "npm start") — ela não tem esse problema.'
          );
        } else {
          showError(err.message);
        }
      } finally {
        submitBtn.disabled = false;
        loadingEl.hidden = true;
      }
    });

    refreshKeyUI();
    renderHistory();
  </script>
</body>
</html>
